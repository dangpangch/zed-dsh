# Builds per-platform self-contained dsh-acp-zed archives and publishes them
# to a GitHub Release; then injects URLs/sha256 into registry/agent.json and
# extension/extension.toml. SCAFFOLD — activation lands with M3
# (docs/design.zh.md §8, §13).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  archives:
    strategy:
      fail-fast: false
      matrix:
        include:
          # os/arch -> runner (native, so optional prebuilds resolve per-OS)
          - { os: macos-14,   platform: darwin-aarch64 }
          - { os: macos-13,   platform: darwin-x86_64 }
          - { os: ubuntu-22.04, platform: linux-x86_64 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 } # TODO(M3): self-hosted/qemu fallback
          - { os: windows-2022, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install server deps
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Build server
        working-directory: server
        run: pnpm build
      - name: Build archive
        run: node packaging/build-archive.mjs --platform ${{ matrix.platform }} --node v24
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-acp-zed-${{ matrix.platform }}
          path: packaging/out/dsh-acp-zed-${{ matrix.platform }}.*

  release:
    needs: archives
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packaging/out
          merge-multiple: true
      # TODO(M3): gh release create with all archives; node packaging/inject.mjs
      # recomputes sha256 and rewrites registry/agent.json (distribution.binary)
      # and extension/extension.toml from packaging/archive-manifest.json.
      - run: ls -R packaging/out
